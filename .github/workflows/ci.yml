name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint va testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bog'liqliklarni o'rnatish
        run: pip install -r requirements.txt ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

  docker:
    name: Docker image, smoke test, publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image build (gha cache bilan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: xarid-audit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — butun stekni compose bilan ko'tarish
        env:
          IMAGE: xarid-audit:ci
          SCALE: "0.03"
          CHAOS_FAIL_RATE: "0.05"
        run: |
          printf 'TREASURY_API_TOKEN=%s\nPII_SALT=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
          docker compose up -d --no-build report
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -qi "audit"
          echo "Hisobot nginx orqali muvaffaqiyatli ochildi"

      - name: Xato bo'lsa loglar
        if: failure()
        run: docker compose logs --no-color

      - name: Tozalash
        if: always()
        run: docker compose down -v

      - name: Teglar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: GHCR'ga kirish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR'ga yuklash
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
